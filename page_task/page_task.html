<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="page_task.css">
    <link rel="stylesheet" href="mobile_task.css" media="screen and (max-width: 670px)">
</head>

<body>
    <header>
        <nav>
            <div>
                <a href=../setting/setting.html><img src="../img/setting.webp" alt="Setting"></a>
                <a href="../home/home.html"><button>Home</button></a>
            </div>
            <h1>Morning routine</h1>
        </nav>
    </header>
    <main>
        <div class="aside">
            <button id="addTask">Add task</button>
            <button id="deleteTask">Delete task</button>
            <button id="priority">Priority</button>
            <button id="daily">Daily</button>
        </div>
        <section class="tasks">
            <div class="task">
                <input type="checkbox">
                <input type="text" placeholder="Choose a task name">
                <!-- TENTATIVE DE POPUP -->

                <button onclick="openPopup()">Open the task</button>
            </div>


            <!-- TENTATIVE DE POPUP -->

            <div id="popup-overlay">
                <div class="popup-content">
                    <h2>Task name</h2>
                    <textarea placeholder="Enter your notes here..."></textarea>
                    <button href="#">Create a rappel</button>
                    <button href="javascript:void(0)" onclick="closePopup()" class=" popup-exit">Fermer</button>

                </div>

            </div>
        </section>
    </main>
</body>
<script src="page_task.js"></script>

</html>
