<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="setting.css">
</head>

<body>
    <header>
        <nav>
            <div>
                <a href="#"><img src="img/bx-cog.svg" alt=""></a>
                <a href="../home/home.html"><button>Home</button></a>
            </div>
            <h1 class="setting">Settings</h1>
        </nav>
    </header>

    <main>

        <div class="aside">
            <button id="General">Générale</button>
            <button>Task</button>
            <button>Confidentialité</button>
            <button id="interface">Interface</button>
        </div>

        <section>
            <article id="reglage">
                <h2>Mode clair/sombre</h2>
                <h2>Langue</h2>
                <h2>Notification</h2>
                <h2>Taille du texte</h2>
            </article>

            <article class="button">

                <select name="theme" id="theme-select">
                    <option value="">--Please choose an option--</option>
                    <option value="sombre">sombre</option>
                    <option value="clair">clair</option>
                </select>

                <select name="language" id="language-select">
                    <option value="">--Please choose an option--</option>
                    <option value="français">français</option>
                    <option value="anglais  ">anglais</option>
                </select>


                <select name="notification" id="notification-select">
                    <option value="">--Please choose an option--</option>
                    <option value="on">on</option>
                    <option value="off">off</option>
                </select>

                <select name="size" id="size-select">
                    <option value="">--Please choose an option--</option>
                    <option value="s">S</option>
                    <option value="s">L</option>
                </select>
            </article>
        </section>


    </main>


</body>

<footer>

    <button>sauvegarder</button>

</footer>
